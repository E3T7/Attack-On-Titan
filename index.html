<!DOCTYPE html>
<html>
<head>
  <title>Attack Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>
<body>

<div class="chat-container">
  <h2 class="apalah">Attack On Titan</h2>
  <div id="chat-box"></div>
  <div class="input-area">
    <input type="text" id="user-input" placeholder="Tulis pesan...">
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("user-input");
  const message = input.value;
  if (!message) return;

  addMessage("You", message);
  input.value = "";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const data = await response.json();
    
    if (!response.ok) {
      addMessage("Bot", "Error: " + (data.error || "Undefined"));
      return;
    }
    
    addMessage("Bot", data.reply || "No response");
  } catch (error) {
    addMessage("Bot", "Error: " + error.message);
  }
}

function addMessage(sender, text) {
  const chatBox = document.getElementById("chat-box");
  const msg = document.createElement("div");
  msg.className = sender === "You" ? "user" : "bot";
  msg.innerText = sender + ": " + text;
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
